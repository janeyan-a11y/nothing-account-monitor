name: Daily Social Monitor

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: social-monitor
        run: pip install requests twikit

      - name: Run fetch
        working-directory: social-monitor
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python run.py

      - name: Commit updated data back
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add social-monitor/data/mentions.json
          git diff --cached --quiet || git commit -m "Auto: update mentions data [skip ci]"
          git push origin master

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          publish_branch: gh-pages
          keep_files: false
          commit_message: "Auto: daily social monitor update [skip ci]"
